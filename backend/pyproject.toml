[project]
name = "newssent"
version = "0.1.0"
description = "財經新聞情緒分析與即時監控系統"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",           # NewsAPI HTTP 呼叫
    "python-dotenv>=1.0",    # 讀取 .env 內的 NewsAPI 金鑰
    "slowapi>=0.1.9",        # 每 IP 限流，保護 NewsAPI 每日額度
    # Windows 的 zoneinfo 不含 IANA 時區資料庫，需靠此套件補上
    "tzdata>=2024.1",
]

# 以下相依較重，依 PLAN.md 分階段安裝，骨架階段不裝：
#   Phase 2（基線）：scikit-learn
#   Phase 3（transformer）：torch（CUDA wheel，依本機 CUDA 版本）、transformers、datasets
# 見 README「分階段安裝」

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newssent*"]

[tool.pytest.ini_options]
# 部分機器全域 %TEMP%\pytest-of-<user> 有殘留資料夾權限被鎖住，改用專案內暫存目錄避開
addopts = "--basetemp=.pytest_tmp"
