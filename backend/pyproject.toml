[project]
name = "newssent"
version = "0.1.0"
description = "財經新聞情緒分析與即時監控系統"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",           # NewsAPI HTTP 呼叫
    "python-dotenv>=1.0",    # 讀取 .env 內的 NewsAPI 金鑰
    "slowapi>=0.1.9",        # 每 IP 限流，保護 NewsAPI 每日額度
    "scikit-learn>=1.5",     # Phase 2 基線模型與關鍵字 TF-IDF
    "joblib>=1.3",           # 模型 artifact 序列化
    # Windows 的 zoneinfo 不含 IANA 時區資料庫，需靠此套件補上
    "tzdata>=2024.1",
    # 新聞備援/主源（免金鑰）：YFinanceNewsProvider
    "yfinance>=0.2.60",
    # Phase 3 transformer 重相依。NVIDIA GPU 訓練請先以 cu128 index 安裝 torch：
    #   pip install torch --index-url https://download.pytorch.org/whl/cu128
    "torch>=2.7",
    "transformers>=4.44",
    "accelerate>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newssent*"]

[tool.pytest.ini_options]
# 部分機器全域 %TEMP%\pytest-of-<user> 有殘留資料夾權限被鎖住，改用專案內暫存目錄避開
addopts = "--basetemp=.pytest_tmp"
markers = [
    "leakage: 資料洩漏回歸測試（pytest -m leakage；pre-push hook 以此為閘門）",
]
