# 每日排程：抓台股中文新聞並評分（情緒預警）→ 匯出靜態 JSON → build → 部署 news.sekinv.com。
#
# 台北 07:30 執行：交易日 s 的預警只用 s 開盤（09:00）前發布的標題，這個時間點讓看板在開盤前上線；
# 07:30–09:00 之間的標題由隔天的執行補進（看板每次都從逐則分數重算）。週末照跑，讓 FinMind 用量平均。
#
# 狀態（alert_scores.db、news_cache.db、上一版網站資料）存在孤立分支 state，每次覆寫成單一 commit；
# 另存 30 天的 artifact 供回復。資料庫只要通過完整性檢查就保存；site-data 只在正式站部署成功後才更新。
# 評分額度用盡（exit 3）或台股新聞抓取失敗時照常部署美股新聞與情緒，頁面會標示預警的更新狀態。
name: daily

on:
  schedule:
    - cron: "30 23 * * *" # 台北 07:30
  workflow_dispatch:
    inputs:
      branch:
        description: "Cloudflare Pages 分支（master＝正式站；其他名稱＝preview 預覽網址）"
        default: master

permissions:
  contents: write # 推 state 分支、下載 Release 模型
  actions: write # keepalive：公開 repo 60 天無活動會自動停用排程

concurrency:
  group: site # 與 deploy.yml、backfill.yml 共用：同一時間只有一個在寫狀態或部署
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PAGES_BRANCH: ${{ inputs.branch || 'master' }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 取出狀態分支
        uses: actions/checkout@v4
        with:
          ref: state
          path: _state

      - name: 還原狀態
        run: cp _state/alert_scores.db _state/news_cache.db backend/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-ci.txt

      - name: 安裝相依（版本鎖定；CPU 版 torch）
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e "backend[dev]" -c backend/requirements-ci.txt

      - name: 模型快取
        uses: actions/cache@v4
        with:
          path: backend/artifacts/bert-combined/model.joblib
          key: models-${{ hashFiles('backend/models.lock') }}

      - name: 取得模型（GitHub Release，驗證 sha256）
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_models.sh

      - name: 台股新聞抓取與評分（情緒預警）
        id: alerts
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set +e
          python -m newssent.inference.alert_recorder --max-requests 3000
          rc=$?
          set -e
          # 0＝完成；3＝評分額度用盡（已評的已存檔，明天接續）；其他＝失敗（美股部分照常部署）
          case $rc in
            0) status=ok ;;
            3) status=quota; echo "::warning::Gemini 評分額度用盡，部分標題明天補評" ;;
            *) status=failed; echo "::warning::台股新聞更新失敗（exit ${rc}），預警沿用前一次的分數" ;;
          esac
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: 資料庫完整性檢查
        if: always()
        id: integrity
        run: |
          python - <<'PY'
          import sqlite3, sys
          bad = [f for f in ("backend/alert_scores.db", "backend/news_cache.db")
                 if sqlite3.connect(f).execute("PRAGMA integrity_check").fetchone()[0] != "ok"]
          print("損毀：" + "、".join(bad) if bad else "ok")
          sys.exit(1 if bad else 0)
          PY

      - name: 匯出靜態 JSON（含發布關卡）
        working-directory: backend
        run: python -m newssent.export_static --out ../frontend/public/data --prev ../_state/site-data/meta.json --alerts-status ${{ steps.alerts.outputs.status }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build 靜態站
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC_DATA: "1"
        run: |
          tickers=$(jq -r '.tickers | join(",")' public/data/tickers.json)
          export NEXT_PUBLIC_TICKERS="${tickers}"
          npm ci --no-audit --no-fund
          npm run build

      - name: 部署 Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=news-sentiment-monitor --branch=${{ env.PAGES_BRANCH }} --commit-dirty=true

      - name: 保存狀態
        if: always() && steps.integrity.outcome == 'success'
        run: |
          cp backend/alert_scores.db backend/news_cache.db _state/
          if [ "${{ steps.deploy.outcome }}" = "success" ] && [ "${PAGES_BRANCH}" = "master" ]; then
            rm -rf _state/site-data && cp -r frontend/public/data _state/site-data
          fi
          python3 - <<'PY'
          import json, os
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "saved_at_taipei": os.popen("TZ=Asia/Taipei date -Iseconds").read().strip(),
              "alerts_status": "${{ steps.alerts.outputs.status }}",
          }, open("_state/STATE.json", "w"), ensure_ascii=False, indent=1)
          PY
          scripts/commit_state.sh _state "state: daily run ${GITHUB_RUN_ID}"

      - name: 備份狀態（artifact，保留 30 天）
        if: always() && steps.integrity.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: _state
          include-hidden-files: false
          retention-days: 30

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" || true
